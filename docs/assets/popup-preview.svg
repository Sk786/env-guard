<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Env Guard rule settings</title>
  <desc id="desc">A preview of the Env Guard popup with a production URL rule, color, and border width controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff" />
      <stop offset="1" stop-color="#edf2f8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#172b4d" flood-opacity=".14" />
    </filter>
  </defs>
  <rect width="960" height="600" rx="28" fill="url(#bg)" />
  <g filter="url(#shadow)">
    <rect x="70" y="56" width="820" height="488" rx="20" fill="#fff" />
    <rect x="70" y="56" width="820" height="76" rx="20" fill="#fbfcfe" />
    <path d="M70 112v-36a20 20 0 0 1 20-20h780a20 20 0 0 1 20 20v36Z" fill="#fbfcfe" />
    <path d="M70 132h820" stroke="#e6ebf1" stroke-width="2" />
    <rect x="98" y="78" width="36" height="36" rx="11" fill="#155eef" />
    <path d="M107 96h18m-9-9v18" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
    <text x="150" y="96" fill="#172b4d" font-family="Arial, sans-serif" font-size="21" font-weight="700">Env Guard</text>
    <text x="150" y="116" fill="#667085" font-family="Arial, sans-serif" font-size="13">Add a rule for this environment.</text>
    <text x="108" y="170" fill="#344054" font-family="Arial, sans-serif" font-size="13" font-weight="700">URL / PATTERN</text>
    <rect x="108" y="181" width="744" height="48" rx="9" fill="#fff" stroke="#d0d8e2" stroke-width="2" />
    <text x="126" y="211" fill="#344054" font-family="monospace" font-size="15">portal.example.com/*</text>
    <rect x="108" y="244" width="18" height="18" rx="4" fill="#155eef" />
    <path d="m112 253 3 3 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="136" y="258" fill="#52647a" font-family="Arial, sans-serif" font-size="14">Use regular expression</text>
    <text x="108" y="297" fill="#344054" font-family="Arial, sans-serif" font-size="13" font-weight="700">ENVIRONMENT</text>
    <rect x="108" y="308" width="744" height="48" rx="9" fill="#fff" stroke="#d0d8e2" stroke-width="2" />
    <circle cx="130" cy="332" r="6" fill="#d92d20" />
    <text x="148" y="337" fill="#172b4d" font-family="Arial, sans-serif" font-size="15">Production</text>
    <path d="m824 328 8 8 8-8" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="108" y="390" fill="#344054" font-family="Arial, sans-serif" font-size="13" font-weight="700">BORDER COLOR</text>
    <rect x="108" y="401" width="48" height="42" rx="8" fill="#d92d20" />
    <rect x="170" y="401" width="202" height="42" rx="8" fill="#fff" stroke="#d0d8e2" stroke-width="2" />
    <text x="188" y="428" fill="#344054" font-family="monospace" font-size="15">#d92d20</text>
    <text x="108" y="474" fill="#344054" font-family="Arial, sans-serif" font-size="13" font-weight="700">BORDER WIDTH</text>
    <path d="M108 496h680" stroke="#d0d8e2" stroke-width="6" stroke-linecap="round" />
    <path d="M108 496h204" stroke="#155eef" stroke-width="6" stroke-linecap="round" />
    <circle cx="312" cy="496" r="11" fill="#fff" stroke="#155eef" stroke-width="4" />
    <text x="838" y="501" text-anchor="end" fill="#52647a" font-family="Arial, sans-serif" font-size="14">4 px</text>
    <rect x="108" y="513" width="744" height="1" fill="#fff" />
  </g>
</svg>
